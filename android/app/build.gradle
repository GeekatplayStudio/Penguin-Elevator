apply plugin: 'com.android.application'

// Release signing credentials live in android/key.properties, which is
// gitignored. Copy key.properties.example and fill it in, or set the same four
// values as environment variables (PE_STORE_FILE, PE_STORE_PASSWORD,
// PE_KEY_ALIAS, PE_KEY_PASSWORD) for CI. Without either, release builds fall
// back to unsigned output and Play will reject the bundle.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolveSigning = { String propKey, String envKey ->
    return keystoreProperties.getProperty(propKey) ?: System.getenv(envKey)
}

def storeFileValue = resolveSigning('storeFile', 'PE_STORE_FILE')
def storePasswordValue = resolveSigning('storePassword', 'PE_STORE_PASSWORD')
def keyAliasValue = resolveSigning('keyAlias', 'PE_KEY_ALIAS')
def keyPasswordValue = resolveSigning('keyPassword', 'PE_KEY_PASSWORD')
def hasReleaseSigning = storeFileValue && storePasswordValue && keyAliasValue && keyPasswordValue

android {
    namespace = "com.geekatplay.penguinelevator"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.geekatplay.penguinelevator"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "2.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                // storeFileValue is documented (key.properties.example) as
                // relative to android/, not android/app/ - resolve against
                // rootProject so `file()`'s app/-relative default doesn't
                // silently look in the wrong directory.
                storeFile rootProject.file(storeFileValue)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }
    buildTypes {
        release {
            // Capacitor's WebView bridge resolves plugin classes reflectively,
            // so shrinking is left off - the payload is the web bundle anyway.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("WARNING: no release signing config found - the release build will be UNSIGNED and Play will reject it. See android/key.properties.example.")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
